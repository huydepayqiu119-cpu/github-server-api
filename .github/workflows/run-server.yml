name: Run Server API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: run-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 700

    steps:
      - uses: actions/checkout@v4
        with:
          repository: huydepayqiu119-cpu/server-api
          token: ${{ secrets.APISERVER }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq && sudo apt-get install -y ngrok

      - name: Start server, ngrok and stream logs
        run: |
          tg() { curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode="HTML" -d text="$1" > /dev/null; }

          node index.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 15); do curl -s http://localhost:25565/health > /dev/null 2>&1 && break; sleep 2; done

          if ! curl -s http://localhost:25565/health > /dev/null 2>&1; then
            tg "❌ <b>Server failed!</b>&#10;<code>$(tail -20 /tmp/server.log)</code>"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"
          ngrok http 25565 > /tmp/ngrok.log 2>&1 &

          for i in $(seq 1 30); do
            NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' 2>/dev/null)
            [ -n "$NGROK_URL" ] && [ "$NGROK_URL" != "null" ] && break
            sleep 2
          done

          if [ -z "$NGROK_URL" ] || [ "$NGROK_URL" = "null" ]; then
            tg "❌ <b>Ngrok failed!</b>&#10;<code>$(tail -10 /tmp/ngrok.log)</code>"
            exit 1
          fi

          FILE_SHA=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.APISERVER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/huydepayqiu119-cpu/github-server-api/contents/ip.txt \
            | jq -r '.sha')

          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.APISERVER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/huydepayqiu119-cpu/github-server-api/contents/ip.txt \
            -d "{\"message\":\"update url: $NGROK_URL\",\"content\":\"$(echo -n "$NGROK_URL" | base64 -w 0)\",\"sha\":\"$FILE_SHA\"}"

          EARLY_LOG=$(cat /tmp/server.log | head -c 3000)
          tg "🌐 <b>$NGROK_URL</b>&#10;⏰ $(date '+%Y-%m-%d %H:%M:%S UTC')&#10;&#10;<code>$EARLY_LOG</code>"

          echo "Tunnel URL: $NGROK_URL"

          LAST_PING=$(date +%s)
          tail -n +1 -f /tmp/server.log | while IFS= read -r line; do
            echo "$line"
            if echo "$line" | grep -qiE "(error|exception|crash|fatal|uncaught|unhandled)"; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode="HTML" -d text="⚠️ <b>Error</b>&#10;<code>$(echo "$line" | head -c 500)</code>" > /dev/null
            fi
            NOW=$(date +%s)
            if [ $((NOW - LAST_PING)) -ge 1800 ]; then
              UPTIME=$(ps -p $SERVER_PID -o etime= 2>/dev/null || echo "unknown")
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode="HTML" -d text="💓 <b>Still running</b>&#10;Uptime: $UPTIME&#10;URL: <code>$NGROK_URL</code>" > /dev/null
              LAST_PING=$NOW
            fi
          done
        env:
          PORT: 25565
          GITHUB_TOKEN: ${{ secrets.APISERVER }}
          GITHUB_OWNER: huydepayqiu119-cpu
          GITHUB_REPO: github-server-api
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LOBFILE_API_KEYS: ${{ secrets.LOBFILE_API_KEYS }}
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
