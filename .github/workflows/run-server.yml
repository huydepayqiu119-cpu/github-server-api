name: Run Server API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          repository: huydepayqiu119-cpu/server-api
          token: ${{ secrets.APISERVER }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start server
        run: node index.js &
        env:
          PORT: 25565
          GITHUB_TOKEN: ${{ secrets.APISERVER }}
          GITHUB_OWNER: huydepayqiu119-cpu
          GITHUB_REPO: github-server-api
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LOBFILE_API_KEYS: ${{ secrets.LOBFILE_API_KEYS }}

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:25565/health > /dev/null 2>&1 && echo "Ready" && break
            echo "Waiting... ($i)" && sleep 2
          done

      - name: Tunnel and update ip.txt
        run: |
          cloudflared tunnel --url http://localhost:25565 --no-autoupdate 2>&1 | tee /tmp/cf.log &
          CF_PID=$!

          for i in $(seq 1 30); do
            CF_URL=$(grep -o 'https://[a-z0-9\-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$CF_URL" ] && echo "Tunnel URL: $CF_URL" && break
            sleep 2
          done

          [ -z "$CF_URL" ] && echo "Failed to get tunnel URL" && exit 1

          FILE_SHA=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.APISERVER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/huydepayqiu119-cpu/github-server-api/contents/ip.txt \
            | jq -r '.sha')

          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.APISERVER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/huydepayqiu119-cpu/github-server-api/contents/ip.txt \
            -d "{\"message\":\"update url: $CF_URL\",\"content\":\"$(echo -n "$CF_URL" | base64 -w 0)\",\"sha\":\"$FILE_SHA\"}"

          echo "ip.txt updated: $CF_URL"
          wait $CF_PID
